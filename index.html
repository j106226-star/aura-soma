<script>/*CALC*/// Number chart core logic. Pure JS, no dependencies. Works in browser and Node.
// See SPEC.md for the rules. Anything marked TODO is not yet confirmed.
(function (root) {
  const OFFSET = 78; // card 0..21 -> bottle 78..99

  const sumDigits = (n) => String(n).split("").reduce((a, d) => a + +d, 0);

  // Reduce to a single digit (no 11/22 protection; each layer protects itself by doing one step only).
  const reduce = (n) => { while (n > 9) n = sumDigits(n); return n; };

  // Layer 2: everything except the last digit, plus the last digit.
  // 45 -> 4+5, 99 -> 9+9, 108 -> 10+8, 123 -> 12+3
  const splitSum = (n) => Math.floor(n / 10) + (n % 10);

  // Journey bottle for a card number, or null if it has none.
  const journey = (n) => (n >= 0 && n <= 21 ? n + OFFSET : null);

  // Star: repeat (n + 78 -> digit sum) until reaching 9, 10 or 11.
  const STARS = { 9: "Thinking", 10: "Being", 11: "Feeling" };
  function star(n) {
    let x = n;
    for (let i = 0; i < 30; i++) {
      if (STARS[x]) return { number: x, name: STARS[x] };
      x = sumDigits(x + OFFSET);
    }
    return null;
  }

  // All two-part cuts of a number; only parts in 0..21 get a journey bottle.
  function splits(n) {
    const s = String(n), out = [];
    for (let i = 1; i < s.length; i++) {
      const a = +s.slice(0, i), b = +s.slice(i);
      out.push({ cut: `${a}/${b}`, parts: [a, b].map((p) => ({ n: p, bottle: journey(p) })) });
    }
    return out;
  }

  function compute(bottles) {
    if (!Array.isArray(bottles) || bottles.length !== 4) throw new Error("Need exactly 4 bottle numbers");
    const l2 = bottles.map(splitSum);
    const L3 = l2[0] + l2[1], R3 = l2[2] + l2[3], C3 = L3 + R3;
    const l4 = l2.map(reduce);
    const L5 = l4[0] + l4[1], R5 = l4[2] + l4[3], C5 = L5 + R5;
    const C4 = L3 + R5; // diagonal: layer-3 left + layer-5 right
    const C6 = R3 + L5; // diagonal: layer-3 right + layer-5 left
    const left = reduce(L5), right = reduce(R5);
    const mid = left + right;
    const bottom = [left, reduce(mid), right];
    const top = [bottles[0] + bottles[1], bottles[2] + bottles[3]];
    top.push(top[0] + top[1]);
    return {
      layers: {
        l1: bottles, l2, l3: { L: L3, C: C3, R: R3 }, l4: { nums: l4, C: C4 },
        l5: { L: L5, C: C5, R: R5 }, l6: { C: C6 },
        l7: { left, mid, right, midReduced: bottom[1], extraRow: mid > 9 },
      },
      timeline: [C3, C4, C5, C6, bottom[1]],
      top: top.map((n) => ({ n, splits: splits(n) })),
      stars: bottom.map(star),
    };
  }

  const api = { compute, reduce, splitSum, journey, star, splits, sumDigits };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.AuraCalc = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>

const hs=g.heart.days[md]||[];$("ar").innerHTML=hs.map(n=>card(+n,"心天使")).join("")+card(g.intellectual.bottles[sl],"智慧天使")+card(g.guardian.bottles[i],"守護天使")}
const mini=(n,x,y,w=30)=>{const h=w*1.73;return `<g onclick="info(${n})"><image href="${src(n)}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}"/><text style="display:none"></text>`+`<svg x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" viewBox="0 0 44 76"><rect x="16" y="2" width="12" height="10" rx="2" fill="none" stroke="#999"/><rect x="2" y="12" width="40" height="62" rx="6" fill="none" stroke="#999"/><path d="M4 18Q4 14 8 14H36Q40 14 40 18V42H4Z" fill="${C(B[n][1])}"/><path d="M4 42H40V68Q40 72 36 72H8Q4 72 4 68Z" fill="${C(B[n][2])}"/></svg>`.replace(/^.*$/s,"")+`<text x="${x}" y="${y+h/2+13}" text-anchor="middle" font-size="12" fill="var(--fg)">${n}</text></g>`};
const GR={"財富瓶組":()=>{const p={78:[180,40],66:[40,110],76:[120,110],67:[240,110],77:[320,110],74:[70,185],75:[290,185],65:[130,240],73:[230,240],71:[70,300],72:[290,300],70:[180,350],68:[130,410],69:[230,410]};return `<p class="mu">B65–B78，依照實際擺放圖排列</p><svg viewBox="0 0 360 450" width="100%">${Object.entries(p).map(([n,[x,y]])=>mini(+n,x,y,34)).join("")}</svg>`},
"大師瓶躺平":()=>{const p={64:[150,40],62:[92,120],63:[208,120],60:[62,195],61:[238,195],59:[150,262],57:[52,350],58:[248,350],56:[150,345],55:[150,505]};return `<p class="mu">仰躺，頭在上。左右為畫面左右。</p><svg viewBox="0 0 300 560" width="100%"><g fill="none" stroke="var(--mu)" stroke-width="2"><circle cx="150" cy="120" r="28"/><path d="M150 148V175M80 175H220M110 175V330M190 175V330M80 175L60 330M220 175L240 330M110 330L100 500M190 330L200 500M110 330H190"/></g>${Object.entries(p).map(([n,[x,y]])=>mini(+n,x,y,28)).join("")}</svg>`},
"脈輪瓶組":()=>`<div>${[[20,"頂輪"],[1,"眉心輪"],[2,"喉輪"],[3,"心輪"],[4,"太陽神經叢"],[26,"臍輪"],[5,"海底輪"]].map(([n,c])=>card(n,c+(n==26?"":"（待確認）"))).join("")}</div>`};
$("gb").innerHTML=Object.keys(GR).map((k,i)=>`<button class="b" onclick="gs('${k}')">${k}</button>`).join(" ");
function gs(k){cur=k;$("gv").innerHTML=GR[k]()}gs("財富瓶組");
$("pd").innerHTML="<h4>三顆星</h4>"+Object.values(P.stars).filter(x=>x.name).map(x=>`<p><b>${x.name}</b> ${x.summary}</p>`).join("");
tab(0);bl();go();try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script></body></html>
